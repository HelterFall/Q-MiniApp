<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Q — личный кабинет</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:light dark;--bg:var(--tg-theme-bg-color,#f4f5f7);--card:var(--tg-theme-secondary-bg-color,#fff);--text:var(--tg-theme-text-color,#171717);--muted:var(--tg-theme-hint-color,#777);--accent:var(--tg-theme-button-color,#087cff);--accent-text:var(--tg-theme-button-text-color,#fff);--border:color-mix(in srgb,var(--text) 10%,transparent);--ok:#22a06b;--warn:#d99000}
*{box-sizing:border-box}body{margin:0;padding:max(18px,env(safe-area-inset-top)) 16px max(24px,env(safe-area-inset-bottom));background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.shell{width:min(100%,520px);margin:0 auto}header{display:flex;align-items:center;justify-content:space-between;margin:8px 2px 22px}h1{margin:0;font-size:27px;letter-spacing:-.8px}.subtitle{color:var(--muted);font-size:13px;margin-top:4px}.mark{width:42px;height:42px;display:grid;place-items:center;border-radius:14px;background:var(--accent);color:var(--accent-text);font-weight:800;font-size:20px}
.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px;animation:rise .35s ease both}.label{color:var(--muted);font-size:13px}.balance{font-size:34px;font-weight:750;letter-spacing:-1.2px;margin-top:7px}.product-art{height:158px;border-radius:12px;display:grid;place-items:center;font-size:70px;margin-bottom:18px;background:linear-gradient(140deg,#dce8f7,#f7f8fa)}.product-name{font-size:20px;font-weight:700}.description{color:var(--muted);font-size:14px;line-height:1.45;margin-top:7px}.price{font-size:25px;font-weight:750;margin:18px 0}
button{border:0;width:100%;border-radius:12px;padding:15px 18px;font-family:inherit;font-size:16px;font-weight:650;background:var(--accent);color:var(--accent-text);cursor:pointer;transition:transform .15s,opacity .2s}button:active{transform:scale(.985)}button:disabled{opacity:.55;cursor:wait}.status-line{display:flex;gap:12px;align-items:center}.dot{width:10px;height:10px;border-radius:50%;background:var(--ok);flex:none}.dot.busy{background:var(--warn);animation:pulse 1s infinite}.status-title{font-weight:650;font-size:15px}.status-detail,#notice{color:var(--muted);font-size:13px;line-height:1.4;margin-top:5px;overflow-wrap:anywhere}#notice{margin-top:12px}.orders{margin-top:16px}.order-row{padding:12px 0;border-top:1px solid var(--border);font-size:14px}
@keyframes pulse{50%{opacity:.35;transform:scale(.85)}}@keyframes rise{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<main class="shell">
<header><div><h1>Q</h1><div class="subtitle">Личный кабинет</div></div><div class="mark" aria-hidden="true">Q</div></header>
<section class="card"><div class="label">Доступный баланс</div><div class="balance" id="balance">Загрузка…</div></section>
<section class="card"><div class="product-art" aria-hidden="true">📱</div><div class="product-name" id="productName">Новый iPhone 17</div><div class="description">Демонстрационный товар для тестирования оформления заказа.</div><div class="price" id="productPrice">1 200 ₽</div><button id="buyButton" type="button" disabled>Загрузка…</button><div id="notice" role="status" aria-live="polite"></div></section>
<section class="card"><div class="status-line"><div class="dot" id="statusDot"></div><div><div class="status-title" id="status">Нет активных заказов</div><div class="status-detail" id="statusDetail">Статус заказа появится здесь</div></div></div><div class="orders" id="orders"></div></section>
</main>
<script>
(() => {
  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); }
  const initData = (tg && tg.initData) || "";
  const $ = (id) => document.getElementById(id);
  let socket = null, retryTimer = null, retryMs = 1000, disposed = false;
  let currentOrderId = null, product = null;
  const money = (n) => new Intl.NumberFormat("ru-RU").format(n) + " ₽";

  async function api(path, options = {}) {
    if (!initData) throw new Error("Открой приложение через кнопку бота в Telegram.");
    const response = await fetch(path, {
      ...options,
      headers: Object.assign({"Content-Type":"application/json","X-Telegram-Init-Data":initData}, options.headers || {})
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.detail || "Ошибка сервера");
    return data;
  }
  function setStatus(text, detail = "") {
    $("status").textContent = text;
    $("statusDetail").textContent = detail;
    $("statusDot").classList.toggle("busy", ["Заказ создан","Сборка на складе"].includes(text));
  }
  async function loadProfile() {
    const me = await api("/api/me");
    $("balance").textContent = money(me.balance);
    if (!currentOrderId) setStatus(me.order_status || "Нет активных заказов");
  }
  async function loadOrders() {
    const list = await api("/api/orders");
    const target = $("orders");
    target.replaceChildren();
    if (!list.length) return;
    const heading = document.createElement("div");
    heading.className = "label"; heading.textContent = "Последние заказы"; target.appendChild(heading);
    list.forEach((order) => {
      const row = document.createElement("div");
      row.className = "order-row";
      row.textContent = "№" + order.order_id + " · " + order.product_name + " · " + order.status;
      target.appendChild(row);
    });
  }
  async function loadProducts() {
    const list = await api("/api/products");
    product = list.find((item) => item.id === "iphone17") || list[0];
    if (!product) throw new Error("Нет доступных товаров.");
    $("productName").textContent = product.name;
    $("productPrice").textContent = money(product.price);
    $("buyButton").textContent = "Купить"; $("buyButton").disabled = false;
  }
  function connectSocket() {
    if (disposed || !initData) return;
    const scheme = location.protocol === "https:" ? "wss:" : "ws:";
    socket = new WebSocket(scheme + "//" + location.host + "/ws");
    socket.onopen = () => { retryMs = 1000; socket.send(initData); };
    socket.onmessage = async (event) => {
      try {
        const msg = JSON.parse(event.data);
        if (msg.type === "order_status") {
          if (currentOrderId && msg.order_id !== currentOrderId) return;
          currentOrderId = msg.order_id; setStatus(msg.status, "Заказ №" + msg.order_id);
          await Promise.all([loadProfile(), loadOrders()]);
        }
      } catch (err) { console.error("WebSocket message error", err); }
    };
    socket.onclose = scheduleReconnect;
    socket.onerror = () => socket.close();
  }
  function scheduleReconnect() {
    if (disposed || retryTimer) return;
    $("statusDetail").textContent = "Связь потеряна — переподключаемся…";
    retryTimer = setTimeout(() => {
      retryTimer = null; retryMs = Math.min(retryMs * 2, 15000); connectSocket();
      loadOrders().catch(console.error);
    }, retryMs);
  }
  $("buyButton").addEventListener("click", async () => {
    if (!product) return;
    const button = $("buyButton"); button.disabled = true; $("notice").textContent = "Создаём заказ…";
    try {
      const key = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + "-" + Math.random().toString(36).slice(2));
      const result = await api("/api/create-order", {method:"POST",body:JSON.stringify({product_id:product.id,idempotency_key:key})});
      currentOrderId = result.order_id; $("balance").textContent = money(result.balance);
      setStatus(result.status, "Заказ №" + result.order_id);
      $("notice").textContent = "Заказ принят на тестовую обработку."; await loadOrders();
    } catch (err) { $("notice").textContent = err.message; }
    finally { button.disabled = false; }
  });
  window.addEventListener("pagehide", () => { disposed = true; if (retryTimer) clearTimeout(retryTimer); if (socket) socket.close(); });
  Promise.all([loadProfile(),loadProducts(),loadOrders()]).then(connectSocket).catch((err) => {
    $("notice").textContent = err.message; $("buyButton").textContent = "Недоступно";
  });
})();
</script>
</body>
</html>
